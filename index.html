<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Speed Typing Test</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <h1>⚡ Speed Typing Test</h1>
            <p>Test your typing speed and accuracy</p>
        </header>


        <!-- Difficulty Buttons -->
        <div class="difficulty-controls">

            <button class="diff-btn active"
                    data-difficulty="easy">
                Easy
            </button>

            <button class="diff-btn"
                    data-difficulty="medium">
                Medium
            </button>

            <button class="diff-btn"
                    data-difficulty="hard">
                Hard (Code)
            </button>

        </div>


        <!-- Statistics -->
        <div class="stats-container">

            <div class="stat-box">
                <div class="stat-label">TIME</div>
                <div class="stat-value" id="timer">60s</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">WPM</div>
                <div class="stat-value" id="wpm">0</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">ACCURACY</div>
                <div class="stat-value" id="accuracy">100%</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">ERRORS</div>
                <div class="stat-value" id="errors">0</div>
            </div>

        </div>


        <!-- Typing Passage -->
        <div class="typing-card">

            <div class="passage-title">
                Type the following text:
            </div>

            <div id="text-display" class="text-display"></div>

            <!-- Typing Input -->
            <textarea
                id="typing-input"
                placeholder="Start typing here..."
                autocomplete="off"
                spellcheck="false">
            </textarea>

            <!-- Restart -->
            <button id="restart-btn" class="restart-btn">
                Restart Test
            </button>

        </div>


        <!-- Final Result -->
        <div id="result" class="result hidden">

            <h2>Test Complete!</h2>

            <div class="result-grid">

                <div>
                    <span>WPM</span>
                    <strong id="final-wpm">0</strong>
                </div>

                <div>
                    <span>Accuracy</span>
                    <strong id="final-accuracy">0%</strong>
                </div>

                <div>
                    <span>Errors</span>
                    <strong id="final-errors">0</strong>
                </div>

                <div>
                    <span>Time</span>
                    <strong id="final-time">60s</strong>
                </div>

            </div>

        </div>


        <!-- Leaderboard -->
        <div class="leaderboard">

            <h2>🏆 Leaderboard <span>(Top 5)</span></h2>

            <ol id="leaderboard-list">
                <!-- Scores generated by JavaScript -->
            </ol>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
